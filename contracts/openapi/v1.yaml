openapi: 3.0.3
info:
  title: Observability Auth Service API
  description: Multi-tenant authentication, RBAC authorization, organization management, audit logging, 3-tier API key permissions, user blocking/soft-deletion, and 13-pillar security hardening contract with standardized API response envelopes (status, message, data, error).
  version: 1.0.0
paths:
  /api/v1/auth/sign-up:
    post:
      summary: Register new user and unique organization
      parameters:
        - in: header
          name: X-CSRF-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User and organization successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Validation failure or non-unique organization name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '409':
          description: User email or organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/sign-in:
    post:
      summary: User sign in with IP and client audit logging metadata
      parameters:
        - in: header
          name: X-Forwarded-For
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: X-CSRF-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Successful authentication with audit log recorded and JTI assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Invalid credentials or user blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '423':
          description: Account locked due to consecutive failed sign-in attempts (ACCOUNT_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '429':
          description: Rate limit exceeded for IP address window or account lockout threshold (RATE_LIMIT_EXCEEDED / ACCOUNT_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/sign-out:
    post:
      summary: Invalidate current JWT session token by adding its JTI (JWT ID) to the Redis token denylist cache with remaining TTL. Records sign-out audit event.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session token invalidated and JTI denylist entry created in Redis cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Missing, expired, or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Exchange refresh token for fresh access token and new rotated refresh token (RFC 6749 §10.4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Cryptographically signed or opaque refresh token
      responses:
        '200':
          description: Tokens refreshed and rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Refresh token invalid, expired, or reuse detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/routes:
    get:
      summary: List all active registered auth endpoints, HTTP methods, security parameters, and metadata
      responses:
        '200':
          description: Active route inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/session:
    get:
      summary: Verify session token signature and expiration, perform O(1) Redis JTI denylist check, and return verified user context payload.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active session payload with JTI claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized, token expired, signature invalid, or token JTI denylisted in Redis cache

  /api/v1/auth/organizations:
    get:
      summary: List all organizations the authenticated user belongs to
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of organizations for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    post:
      summary: Create a new multi-tenant organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '409':
          description: Organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/organizations/{id}:
    get:
      summary: Get single organization details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    patch:
      summary: Update organization name or slug
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    delete:
      summary: Soft delete organization and cascade delete all related user details, API keys, and logs with timestamp. Retained for 30 days before permanent deletion.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization and related entity details soft-deleted with timestamp recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/organizations/{id}/switch:
    post:
      summary: Switch active organization context. Invalidates current token and issues a new scoped JWT for the target organization.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New scoped token issued for target organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '403':
          description: User does not belong to target organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/me:
    get:
      summary: Get the authenticated user's own profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    patch:
      summary: Update the authenticated user's own profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/users:
    get:
      summary: List all users in the authenticated user's organization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of organization members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    post:
      summary: Create new user belonging to a specific organization with specific permissions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created in target organization with specific permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Validation error or invalid org_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/invite:
    post:
      summary: Invite a user to the current organization by email. Creates user with specified role and permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: User invited and created in organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '409':
          description: User with that email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}:
    get:
      summary: Get specific user profile by ID (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    delete:
      summary: Soft delete user record with timestamp (30-day backup retention)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User soft-deleted with timestamp recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}/block:
    post:
      summary: Block user access and record blocking timestamp
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User blocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}/unblock:
    delete:
      summary: Unblock a previously blocked user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unblocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}/role:
    patch:
      summary: Update a user's role in the organization (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/users/{id}/permissions:
    get:
      summary: Get a specific user's effective permission set
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    patch:
      summary: Update a specific user's permission set (admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPermissionsRequest'
      responses:
        '200':
          description: User permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset token via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/reset-password:
    post:
      summary: Reset user password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/change-password:
    post:
      summary: Change password for authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password successfully changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/verify-email:
    post:
      summary: Verify user email using single-use cryptographic token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email address verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/resend-verification:
    post:
      summary: Dispatch fresh email verification token to user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification email dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid email address or user already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/mfa/setup:
    post:
      summary: Generate base32 secret and otpauth URI for TOTP MFA enrollment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MFA setup parameters generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '409':
          description: MFA already enabled on this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/mfa/verify:
    post:
      summary: Confirm TOTP code to activate MFA and receive 10 recovery codes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA enabled and single-use recovery codes generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid TOTP verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/mfa/challenge:
    post:
      summary: Complete two-stage login using TOTP code or recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: MFA challenge verified and final session JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid or already used MFA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/mfa/recovery-codes:
    post:
      summary: Regenerate 10 emergency recovery codes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Recovery codes regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/mfa/disable:
    post:
      summary: Disable MFA on user account (Requires Step-Up Re-Authentication)
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Reauth-Token
          required: true
          schema:
            type: string
          description: Ephemeral step-up token valid for 300 seconds
      responses:
        '200':
          description: MFA successfully disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '403':
          description: Step-up authentication required (WWW-Authenticate StepUp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/step-up/verify:
    post:
      summary: Re-authenticate credentials to receive ephemeral reauth token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                totp_code:
                  type: string
      responses:
        '200':
          description: Step-up token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Invalid password or TOTP code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/admin/impersonate/{id}:
    post:
      summary: Impersonate user account (Requires Step-Up Re-Authentication)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Reauth-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account takeover session initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '403':
          description: Step-up required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/api-keys:
    get:
      summary: List all API keys for the authenticated user's organization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: API keys for the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    post:
      summary: Generate 3-tier API key bound to specific permission table with mandatory TTL for super_secret keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key generated successfully with expiration and raw secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Validation failure (missing expires_at_ms on super_secret key or TTL exceeding 90 days)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/api-keys/verify:
    post:
      summary: Verify API key validity, evaluate permissions, enforce TTL expiration, and record usage telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyApiKeyRequest'
      responses:
        '200':
          description: API key valid, unexpired, unrevoked, with permission evaluation and updated usage timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: API key expired (API_KEY_EXPIRED) or revoked (API_KEY_REVOKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/api-keys/{id}/revoke:
    post:
      summary: Revoke a specific API key by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/permissions:
    get:
      summary: List all system permission definitions and scopes
      responses:
        '200':
          description: Available system permissions table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/audit-logs:
    get:
      summary: Fetch sign-in audit logs for security oversight with optional filters
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: event_type
          required: false
          schema:
            type: string
            enum: [USER_SIGNIN, USER_SIGNOUT, USER_SIGNUP, PASSWORD_RESET, API_KEY_CREATED, ORG_SWITCH]
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit log records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardApiResponse:
      type: object
      required: [status, message, data, error]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ErrorDetail'
          nullable: true

    StandardApiErrorResponse:
      type: object
      required: [status, message, data, error]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        data:
          type: null
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, details]
      properties:
        code:
          type: string
        details:
          type: string

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2

    CreateUserRequest:
      type: object
      required: [email, password, name, org_id, role, permissions]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        name:
          type: string
        org_id:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        permissions:
          type: array
          items:
            type: string

    InviteUserRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [admin, member, viewer]
          default: member
        permissions:
          type: array
          items:
            type: string

    UpdateUserProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, viewer]

    UpdateUserPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string

    SignUpRequest:
      type: object
      required: [email, password, name, organization_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 12
        name:
          type: string
          minLength: 2
        organization_name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [admin, member, viewer]
          default: admin

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        ip_address:
          type: string
          description: Client IP address used for adaptive rate limiting and account lockout evaluation

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 12

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12

    CreateApiKeyRequest:
      type: object
      required: [name, org_id, key_type, permissions]
      properties:
        name:
          type: string
        org_id:
          type: string
        key_type:
          type: string
          enum: [general, testing, super_secret]
          default: general
        expires_at_ms:
          type: integer
          format: int64
          description: Expiration epoch timestamp in milliseconds. Mandatory for super_secret (ak_sec_) keys with maximum 90 days TTL. Optional for general and testing keys.
        permissions:
          type: array
          items:
            type: string

    VerifyApiKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        required_permission:
          type: string

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Single-use cryptographic email verification token

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: User email address to dispatch fresh verification token to

    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP authentication code or emergency recovery code
          example: '123456'

    MfaChallengeRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
          description: Ephemeral challenge token returned from stage-1 sign-in
        code:
          type: string
          description: 6-digit TOTP code or single-use recovery code
          example: '123456'

    ApiKeyRecord:
      type: object
      required: [id, org_id, key_hash, key_prefix, key_type, name, permissions, created_at, status]
      properties:
        id:
          type: string
        org_id:
          type: string
        key_hash:
          type: string
        key_prefix:
          type: string
        key_type:
          type: string
          enum: [general, testing, super_secret]
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at_ms:
          type: integer
          format: int64
          nullable: true
        last_used_at_ms:
          type: integer
          format: int64
          nullable: true
        last_used_ip:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, revoked]

