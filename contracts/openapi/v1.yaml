openapi: 3.0.3
info:
  title: Observability Auth Service API
  description: Multi-tenant authentication, RBAC authorization, organization management, audit logging, 3-tier API key permissions, user blocking/soft-deletion, and 13-pillar security hardening contract with standardized API response envelopes (status, message, data, error).
  version: 1.0.0
paths:
  /api/v1/auth/sign-up:
    post:
      summary: Register new user and unique organization
      parameters:
        - in: header
          name: X-CSRF-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User and organization successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Validation failure, non-unique organization name, or candidate password found in public data breaches (PASSWORD_BREACHED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

        '409':
          description: User email or organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/sign-in:
    post:
      summary: User sign in with IP and client audit logging metadata
      parameters:
        - in: header
          name: X-Forwarded-For
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: X-CSRF-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Successful authentication with audit log recorded and JTI assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Invalid credentials or user blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '403':
          description: High risk sign-in blocked due to extreme impossible travel or proxy threat anomaly (HIGH_RISK_SIGNIN_BLOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '423':
          description: Account locked due to consecutive failed sign-in attempts (ACCOUNT_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
        '429':
          description: Rate limit exceeded for IP address window or account lockout threshold (RATE_LIMIT_EXCEEDED / ACCOUNT_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/challenge/resolve:
    post:
      summary: Resolve adaptive risk soft step-up challenge via verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge_token
                - verification_code
              properties:
                challenge_token:
                  type: string
                  description: Ephemeral HMAC-SHA256 risk challenge token issued during medium-risk sign-in
                verification_code:
                  type: string
                  description: 6-digit verification code or TOTP
      responses:
        '200':
          description: Step-up challenge verified; session tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Invalid challenge token or verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/policies/evaluate:
    post:
      summary: Evaluate fine-grained ABAC / ReBAC policy permissions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject_type
                - subject_id
                - action
                - object_type
                - object_id
              properties:
                subject_type:
                  type: string
                  example: user
                subject_id:
                  type: string
                  example: usr_123
                action:
                  type: string
                  example: write
                object_type:
                  type: string
                  example: report
                object_id:
                  type: string
                  example: rep_q3
                context:
                  type: object
      responses:
        '200':
          description: Policy evaluation decision computed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/policies/relations:
    post:
      summary: Create fine-grained relationship tuple (ReBAC)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject_type
                - subject_id
                - relation
                - object_type
                - object_id
              properties:
                subject_type:
                  type: string
                subject_id:
                  type: string
                relation:
                  type: string
                object_type:
                  type: string
                object_id:
                  type: string
                conditions:
                  type: object
                  description: Dynamic ABAC attributes (e.g. require_mfa, ip_cidr)
                expires_at_ms:
                  type: integer
                  description: Optional epoch timestamp for time-bounded grants
                granted_by:
                  type: string
                  description: Actor or admin ID who issued the grant
      responses:
        '201':
          description: Relationship tuple created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    get:
      summary: Enumerate relationship tuples filtered by subject or object
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Relationship tuples retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    delete:
      summary: Delete or revoke relationship tuple
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject_type
                - subject_id
                - relation
                - object_type
                - object_id
              properties:
                subject_type:
                  type: string
                subject_id:
                  type: string
                relation:
                  type: string
                object_type:
                  type: string
                object_id:
                  type: string
      responses:
        '200':
          description: Relationship tuple deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/sign-out:
    post:
      summary: Invalidate current JWT session token by adding its JTI (JWT ID) to the Redis token denylist cache with remaining TTL. Records sign-out audit event.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session token invalidated and JTI denylist entry created in Redis cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Missing, expired, or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Exchange refresh token for fresh access token and new rotated refresh token (RFC 6749 §10.4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Cryptographically signed or opaque refresh token
      responses:
        '200':
          description: Tokens refreshed and rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Refresh token invalid, expired, or reuse detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/routes:
    get:
      summary: List all active registered auth endpoints, HTTP methods, security parameters, and metadata
      responses:
        '200':
          description: Active route inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/session:
    get:
      summary: Verify session token signature and expiration, perform O(1) Redis JTI denylist check, and return verified user context payload.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active session payload with JTI claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized, token expired, signature invalid, or token JTI denylisted in Redis cache

  /api/v1/auth/sessions:
    get:
      summary: List all active concurrent sessions and devices for the authenticated user (OWASP ASVS 3.3)
      description: Returns active refresh token families with client IP, user agent, and ISO 8601 timestamps, flagging the caller device with is_current true.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: x-session-family
          schema:
            type: string
          required: false
          description: Active session family identifier of the calling user agent
      responses:
        '200':
          description: List of active user sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserSessionSummary'
        '401':
          description: Unauthorized, missing or invalid bearer token
    delete:
      summary: Terminate all other remote sessions (OWASP ASVS 3.3)
      description: Revokes all refresh token families for the authenticated user except the calling device session family.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: x-session-family
          schema:
            type: string
          required: false
          description: Active session family identifier of the calling user agent to preserve
      responses:
        '200':
          description: All remote sessions successfully terminated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revokedCount:
                            type: integer
        '401':
          description: Unauthorized

  /api/v1/auth/sessions/{id}:
    delete:
      summary: Terminate a specific remote session by family identifier (OWASP ASVS 3.3)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Refresh token family identifier to revoke
      responses:
        '200':
          description: Session successfully terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized
        '404':
          description: Session family not found or belongs to another user

  /api/v1/auth/oauth/{provider}/authorize:
    get:
      summary: Initiate OAuth 2.0 / OIDC authorization flow
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [google, github]
        - in: query
          name: redirect_uri
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Authorization URL and signed state generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Unsupported OAuth provider

  /api/v1/auth/oauth/{provider}/callback:
    post:
      summary: Exchange OAuth authorization code for session tokens
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [google, github]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: Successfully authenticated via federated OAuth identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid or expired state parameter or invalid code
        '403':
          description: Identity provider email unverified

  /api/v1/auth/oauth/identities:
    get:
      summary: List linked OAuth identities for authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of linked identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized

  /api/v1/auth/oauth/identities/{provider}:
    delete:
      summary: Unlink federated identity provider from user account
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Identity unlinked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Cannot unlink sole authentication method
        '401':
          description: Unauthorized
        '404':
          description: Identity not found

  /api/v1/auth/domains:
    get:
      summary: List all claimed domains for the authenticated organization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of claimed domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized
    post:
      summary: Register pending domain claim for organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: 'blute.co.in'
                default_role:
                  type: string
                  default: 'member'
                  example: 'member'
      responses:
        '201':
          description: Domain claim registered with DNS TXT verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid domain format or forbidden public freemail domain
        '409':
          description: Domain already claimed by another organization

  /api/v1/auth/domains/{domainId}/verify:
    post:
      summary: Execute immediate on-demand DNS TXT challenge verification for claimed domain
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: domainId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain DNS TXT verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: DNS TXT challenge record not found or does not match
        '404':
          description: Domain not found

  /api/v1/auth/domains/{domainId}:
    patch:
      summary: Update domain auto-join settings and default onboarding role
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: domainId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_join_enabled:
                  type: boolean
                default_role:
                  type: string
      responses:
        '200':
          description: Domain settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Domain not found
    delete:
      summary: Revoke claimed domain
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: domainId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain claim deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
  /api/v1/auth/passkeys/register/start:
    post:
      summary: Generate WebAuthn passkey registration options and challenge
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Registration options returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/passkeys/register/finish:
    post:
      summary: Verify WebAuthn registration attestation and persist passkey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterFinishRequest'
      responses:
        '201':
          description: Passkey registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/passkeys/authenticate/start:
    post:
      summary: Generate WebAuthn assertion challenge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Authentication options returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/passkeys/authenticate/finish:
    post:
      summary: Validate WebAuthn signature and counter clone detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAuthFinishRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/passkeys:
    get:
      summary: List user registered passkeys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Registered passkeys list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/passkeys/{id}:
    delete:
      summary: Delete user passkey
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Passkey deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/roles:
    post:
      summary: Create custom enterprise role with 64-bit permission bitmask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomRoleRequest'
      responses:
        '201':
          description: Custom role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    get:
      summary: List all custom roles for current organization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of custom enterprise roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/roles/{id}:
    get:
      summary: Get custom role by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Custom role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    put:
      summary: Update custom role
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomRoleRequest'
      responses:
        '200':
          description: Custom role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    delete:
      summary: Delete custom role
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Custom role deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/users/{userId}/roles:
    post:
      summary: Assign custom roles to user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesRequest'
      responses:
        '200':
          description: User roles assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/permissions/evaluate:
    post:
      summary: Evaluate 64-bit permission bitmask in O(1) time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatePermissionsRequest'
      responses:
        '200':
          description: Permission evaluation decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/magic-link/send:
    post:
      summary: Request a passwordless magic link email dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkSendRequest'
      responses:
        '200':
          description: Magic link dispatched or generic anti-enumeration acknowledgment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/magic-link/verify:
    get:
      summary: Pre-flight check of magic link token without state consumption
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Magic link validation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/magic-link/consume:
    post:
      summary: Atomically consume magic link token and issue authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkConsumeRequest'
      responses:
        '200':
          description: Session issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/organizations:
    get:
      summary: List all organizations the authenticated user belongs to
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of organizations for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    post:
      summary: Create a new multi-tenant organization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '409':
          description: Organization name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/organizations/{id}:
    get:
      summary: Get single organization details by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    patch:
      summary: Update organization name or slug
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'
    delete:
      summary: Soft delete organization and cascade delete all related user details, API keys, and logs with timestamp. Retained for 30 days before permanent deletion.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization and related entity details soft-deleted with timestamp recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

