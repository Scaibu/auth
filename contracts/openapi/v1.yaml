              schema:
                type: string

  /api/v1/auth/saml/login:
    get:
      summary: Initiate SP-Initiated SAML 2.0 SSO Login
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
        - in: query
          name: return_url
          required: false
          schema:
            type: string
      responses:
        '200':
          description: AuthNRequest and IdP redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  idp_redirect_url:
                    type: string
                  relay_state:
                    type: string

  /api/v1/auth/saml/acs:
    post:
      summary: SAML 2.0 Assertion Consumer Service (ACS)
      description: Consumes and validates SAMLResponse assertion from Identity Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse:
                  type: string
                RelayState:
                  type: string
      responses:
        '200':
          description: SAML authentication successful, session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '401':
          description: Cryptographic signature mismatch, expired assertion, or replay detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiErrorResponse'

  /api/v1/auth/saml/providers:
    post:
      summary: Register enterprise SAML Identity Provider
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamlProviderRegistrationRequest'
      responses:
        '201':
          description: SAML provider registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
    get:
      summary: List registered SAML providers for organization
      security:
        - BearerAuth: []
  /api/v1/auth/webhooks/subscriptions:
    post:
      summary: Register a new webhook subscription for tenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url]
              properties:
                target_url:
                  type: string
                  format: uri
                subscribed_events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook subscription created with one-time raw signing secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'
        '400':
          description: Invalid URL format or missing fields
    get:
      summary: List all active webhook subscriptions for tenant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active webhook subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/auth/webhooks/subscriptions/{id}:
    get:
      summary: Get details of a webhook subscription
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook subscription details
        '404':
          description: Subscription not found
    patch:
      summary: Update webhook subscription URL, events, or active state
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target_url:
                  type: string
                  format: uri
                subscribed_events:
                  type: array
                  items:
                    type: string
                active:
                  type: boolean
      responses:
        '200':
          description: Subscription updated successfully
        '404':
          description: Subscription not found
    delete:
      summary: Soft-delete webhook subscription
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription soft-deleted
        '404':
          description: Subscription not found

  /api/v1/auth/webhooks/subscriptions/{id}/deliveries:
    get:
      summary: List historical delivery ledger records for subscription
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of recent delivery attempts and responses
        '404':
          description: Subscription not found

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardApiResponse:
      type: object
      required: [status, message, data, error]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ErrorDetail'
          nullable: true

    StandardApiErrorResponse:
      type: object
      required: [status, message, data, error]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        data:
          type: null
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, details]
      properties:
        code:
          type: string
        details:
          type: string

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2

    CreateUserRequest:
      type: object
      required: [email, password, name, org_id, role, permissions]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        name:
          type: string
        org_id:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
        permissions:
          type: array
          items:
            type: string

    InviteUserRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [admin, member, viewer]
          default: member
        permissions:
          type: array
          items:
            type: string

    UpdateUserProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, viewer]

    UpdateUserPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string

    SignUpRequest:
      type: object
      required: [email, password, name, organization_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 12
        name:
          type: string
          minLength: 2
        organization_name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [admin, member, viewer]
          default: admin

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        ip_address:
          type: string
          description: Client IP address used for adaptive rate limiting and account lockout evaluation

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 12

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12

    CreateApiKeyRequest:
      type: object
      required: [name, org_id, key_type, permissions]
      properties:
        name:
          type: string
        org_id:
          type: string
        key_type:
          type: string
          enum: [general, testing, super_secret]
          default: general
        expires_at_ms:
          type: integer
          format: int64
          description: Expiration epoch timestamp in milliseconds. Mandatory for super_secret (ak_sec_) keys with maximum 90 days TTL. Optional for general and testing keys.
        ip_allowlist:
          type: array
          items:
            type: string
          description: List of authorized IPv4/IPv6 CIDR blocks (e.g. 10.0.0.0/8, 2001:db8::/32). Empty array permits all IPs.
        rate_quota_rpm:
          type: integer
          description: Maximum allowed requests per minute (RPM) for this key.
        permissions:
          type: array
          items:
            type: string

    VerifyApiKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        client_ip:
          type: string
          description: Ingress client IPv4 or IPv6 address evaluated against key CIDR allowlist.
        required_permission:
          type: string

    UpdateApiKeyAllowlistRequest:
      type: object
      required: [ip_allowlist]
      properties:
        ip_allowlist:
          type: array
          items:
            type: string
          description: Array of CIDR subnet strings to authorize for this API key.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Single-use cryptographic email verification token

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: User email address to dispatch fresh verification token to

    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP authentication code or emergency recovery code
          example: '123456'

    MfaChallengeRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
          description: Ephemeral challenge token returned from stage-1 sign-in
        code:
          type: string
          description: 6-digit TOTP code or single-use recovery code
          example: '123456'

    ApiKeyRecord:
      type: object
      required: [id, org_id, key_hash, key_prefix, key_type, name, permissions, created_at, status]
      properties:
        id:
          type: string
        org_id:
          type: string
        key_hash:
          type: string
        key_prefix:
          type: string
        key_type:
          type: string
          enum: [general, testing, super_secret]
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at_ms:
          type: integer
          format: int64
          nullable: true
        last_used_at_ms:
          type: integer
          format: int64
          nullable: true
        last_used_ip:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, revoked]

    UserSessionSummary:
      type: object
      required: [id, ip_address, user_agent, created_at, last_active_at, is_current]
      properties:
        id:
          type: string
          description: Session family identifier
          example: 'fam_01J9XEXAMPLE'
        ip_address:
          type: string
          description: Client IP address of most recent activity
          example: '192.0.2.1'
        user_agent:
          type: string
          description: User agent string of the client
          example: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'
        created_at:
          type: string
          format: date-time
          description: Initial authentication ISO 8601 UTC timestamp
        last_active_at:
          type: string
          format: date-time
          description: Most recent token rotation or activity ISO 8601 UTC timestamp
        is_current:
          type: boolean
          description: Indicates whether this session belongs to the requesting client device

    OidcDiscoveryResponse:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri, response_types_supported, subject_types_supported, id_token_signing_alg_values_supported, scopes_supported, token_endpoint_auth_methods_supported, code_challenge_methods_supported]
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string

    JwksResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, kid, alg, n, e]
            properties:
              kty:
                type: string
                example: RSA
              use:
                type: string
                example: sig
              kid:
                type: string
              alg:
                type: string
                example: RS256
              n:
                type: string
              e:
                type: string

    OAuthTokenRequest:
      type: object
      required: [grant_type, client_id, code, redirect_uri, code_verifier]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        client_id:
          type: string
        code:
          type: string
        redirect_uri:
          type: string
        code_verifier:
          type: string

    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, id_token, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        id_token:
          type: string
        scope:
          type: string

    OidcUserInfoResponse:
      type: object
      required: [sub]
      properties:
        sub:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        name:
          type: string

    SamlProviderRegistrationRequest:
      type: object
      required: [idp_entity_id, idp_sso_url, idp_certificate_pem]
      properties:
        idp_entity_id:
          type: string
          example: https://idp.example.com/metadata
        idp_sso_url:
          type: string
          example: https://idp.example.com/sso
        idp_certificate_pem:
          type: string
          example: "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----"
        sp_entity_id:
          type: string
          example: urn:auth-service:sp
        attribute_mapping:
          type: object
          properties:
            email:
              type: string
              example: email
            name:
              type: string
              example: displayName

    PasskeyRegisterFinishRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
        friendly_name:
          type: string
        credential:
          type: object
          required: [id, response, type]
          properties:
            id:
              type: string
            rawId:
              type: string
            type:
              type: string
              example: public-key
            response:
              type: object
              required: [clientDataJSON, attestationObject]
              properties:
                clientDataJSON:
                  type: string
                attestationObject:
                  type: string
                transports:
                  type: array
                  items:
                    type: string

    PasskeyAuthFinishRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
        credential:
          type: object
          required: [id, response, type]
          properties:
            id:
              type: string
            rawId:
              type: string
            type:
              type: string
              example: public-key
            response:
              type: object
              required: [clientDataJSON, authenticatorData, signature]
              properties:
                clientDataJSON:
                  type: string
                authenticatorData:
                  type: string
                signature:
                  type: string
                userHandle:
                  type: string

    CreateCustomRoleRequest:
      type: object
      required: [name, permission_mask]
      properties:
        name:
          type: string
          example: 'SRE Lead'
        description:
          type: string
          example: 'Full telemetry write and policy administration'
        permission_mask:
          type: string
          example: '100663296'

    UpdateCustomRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permission_mask:
          type: string

    AssignUserRolesRequest:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          items:
            type: string

    EvaluatePermissionsRequest:
      type: object
      required: [user_id, org_id, required_permissions]
      properties:
        user_id:
          type: string
        org_id:
          type: string
        required_permissions:
          type: array
          items:
            type: string

    MagicLinkSendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        redirect_url:
          type: string
          format: uri

    MagicLinkConsumeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string


