services:
  auth-service:
    image: chiefj/llm-obs-auth:latest
    build:
      context: ..
      dockerfile: auth/Dockerfile
    container_name: observability-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - USE_REAL_DB=true
      - AUTH_DB_HOST=auth-service-db
      - AUTH_DB_PORT=5432
      - AUTH_DB_USER=admin
      - AUTH_DB_PASSWORD=llmobs_s3cret_2026
      - AUTH_DB_NAME=llm_observability
      - DATABASE_URL=postgresql://admin:llmobs_s3cret_2026@auth-service-db:5432/llm_observability
      - AUTH_REDIS_HOST=llmobs-redis-ledger
      - AUTH_REDIS_PORT=6379
      - AUTH_REDIS_PASSWORD=llmobs_redis_s3cret_2026
      - REDIS_URL=redis://:llmobs_redis_s3cret_2026@llmobs-redis-ledger:6379/0
      - KAFKA_BROKERS=llmobs-kafka-broker:9092
      - KAFKA_CLIENT_ID=auth-client
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - JWT_SECRET=super-secure-production-auth-jwt-secret-key-replace-in-env-file-minimum-32-chars!
      - SERVICE_REGISTRY_URL=http://llmobs-service-registry:31426
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://llmobs-otel-collector:4318
      - OTEL_EXPORTER_OTLP_GRPC_ENDPOINT=llmobs-otel-collector:4317
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - KEYCLOAK_BASE_URL=http://auth-service-keycloak:8080
      - KEYCLOAK_ISSUER_URL=http://auth-service-keycloak:8080/realms/llm-observability
      - KEYCLOAK_REALM=llm-observability
      - KEYCLOAK_CLIENT_ID=auth-service-admin
      - KEYCLOAK_CLIENT_SECRET=auth_admin_client_secret_minimum_32_chars!
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - AUTH_GEOIP_PROVIDER=http
      - AUTH_GEOIP_HTTP_ENDPOINT=https://ipwho.is
      - AUTH_GEOIP_TIMEOUT_MS=1500
      - MAILER_PROVIDER=mock
      - MAILER_FROM=noreply@auth.local
      - AUTH_SECURITY_HEADERS_ENABLED=true
      - AUTH_SECURITY_HEADERS_HSTS_ENABLED=true
      - AUTH_SECURITY_HEADERS_CSP_ENABLED=true
      - AUTH_WEBHOOK_TOLERANCE_MS=300000
      - AUTH_WEBHOOK_DEFAULT_RETRIES=5
      - AUTH_HONEYTOKEN_ENABLED=true
      - AUTH_HONEYTOKEN_PREFIX=ht_canary_
      - AUTH_HONEYTOKEN_AUTO_BLOCK_IP=true
      - AUTH_MASTER_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AUTH_MASTER_KEY_ID=kek_v1_root
      - AUTH_BLIND_INDEX_KEY=blind_index_secret_key_minimum_32_chars_long_entropy_seed

    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  auth-db:
    image: postgres:17-alpine
    container_name: auth-service-db
    shm_size: '512mb'
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=llmobs_s3cret_2026
      - POSTGRES_DB=llm_observability
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d llm_observability"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: auth-service-keycloak
    command: start-dev --import-realm --features=opentelemetry
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://auth-service-db:5432/llm_observability
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=llmobs_s3cret_2026
      - KC_DB_SCHEMA=public
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_TRACING_ENABLED=true
      
      - KC_TRACING_ENDPOINT=http://llmobs-otel-collector:4317
      - KC_TRACING_PROTOCOL=grpc
      - KC_TRACING_SERVICE_NAME=auth-service-keycloak
      - KC_TRACING_SAMPLER_TYPE=always_on
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.llmobs.local`) || PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    volumes:
      - ./deploy/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: llmobs-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "31417:4318"
      - "31418:4317"
    restart: unless-stopped
    networks:
      - default

volumes:
  auth_db_data:

networks:
  default:
    name: llmobs-auth-network
    external: true
